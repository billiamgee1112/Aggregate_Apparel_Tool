<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; }
  .card {
    width: 800px;
    height: 800px;
    background: #030712;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    border: 2px solid #1f2937;
    box-sizing: border-box;
  }
  .icon {
    font-size: 140px;
    opacity: 0.35;
    margin-bottom: 20px;
  }
  .label {
    font-size: 32px;
    font-weight: 700;
    color: #4B5563;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🖼️</div>
    <div class="label">Image unavailable</div>
  </div>
</body>
</html>
